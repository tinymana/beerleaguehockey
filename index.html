<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beer League Hockey</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05071a;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        width: 480px;
        height: 320px;
        background: #0b1030;
      }
      #title-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* Developer tuning panel: a dev tool, styled to stay out of the way. */
      #tuning-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 290px;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 8px;
        background: #0b1030;
        border: 2px solid #bfd8ff;
        outline: 2px solid #05071a;
        color: #ffffff;
        font: 11px/1.3 'Courier New', Courier, monospace;
        letter-spacing: 0.5px;
        z-index: 10;
      }
      #tuning-panel[hidden] {
        display: none;
      }
      #tuning-panel .tp-title {
        color: #ffc83a;
        font-weight: bold;
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 2px solid #2b5fd9;
      }
      #tuning-panel .tp-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0 6px;
        margin-bottom: 5px;
      }
      #tuning-panel .tp-value {
        color: #ffc83a;
        font-weight: bold;
      }
      #tuning-panel input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        margin: 1px 0 0;
        accent-color: #ffc83a;
      }
      #tuning-panel .tp-buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #tuning-panel button {
        flex: 1;
        padding: 4px;
        background: #1c2a66;
        color: #ffffff;
        border: 2px solid #bfd8ff;
        border-radius: 0;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      #tuning-panel button:hover {
        background: #2b5fd9;
      }
      #tuning-panel .tp-hint {
        margin-top: 6px;
        color: #6f7fb5;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="title-art" src="./assets/title-locker-room.png" alt="" />
      <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
