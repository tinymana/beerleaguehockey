<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Beer League Hockey</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05071a;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        width: 480px;
        height: 320px;
        background: #0b1030;
      }
      #title-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* Touch controls (phones and tablets): plain pixel-style blocks, temporary until control art is supplied. */
      body.touch {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      /* Held upright, the game sits at the top and the controls take the space under it. */
      body.touch.touch-playing.portrait {
        align-items: flex-start;
      }
      body.touch.touch-playing.portrait #stage {
        transform-origin: top center;
      }
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        font: bold 13px/1 'Courier New', Courier, monospace;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #ffffff;
      }
      #touch-controls[hidden] {
        display: none;
      }
      #touch-controls .tc-left,
      #touch-controls .tc-right {
        position: absolute;
        bottom: max(14px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #touch-controls .tc-left {
        left: max(14px, env(safe-area-inset-left));
      }
      #touch-controls .tc-right {
        right: max(14px, env(safe-area-inset-right));
        width: 168px;
        height: 150px;
      }
      #touch-controls .tc-stick {
        position: relative;
        width: 132px;
        height: 132px;
        box-sizing: border-box;
        background: rgba(11, 16, 48, 0.55);
        border: 3px solid #bfd8ff;
        outline: 3px solid #05071a;
        pointer-events: auto;
        touch-action: none;
      }
      #touch-controls .tc-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        box-sizing: border-box;
        background: #ffc83a;
        border: 3px solid #05071a;
        pointer-events: none;
      }
      #touch-controls .tc-button {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: rgba(28, 42, 102, 0.7);
        border: 3px solid #bfd8ff;
        outline: 3px solid #05071a;
        pointer-events: auto;
        touch-action: none;
      }
      #touch-controls .tc-button.down {
        background: #ffc83a;
        color: #05071a;
      }
      /* Shoot is the big one under the thumb; pass and check sit above and beside it. */
      #touch-controls #tc-shoot {
        right: 0;
        bottom: 0;
        width: 88px;
        height: 88px;
        border-color: #ffc83a;
      }
      #touch-controls #tc-pass {
        right: 98px;
        bottom: 0;
        width: 70px;
        height: 64px;
      }
      #touch-controls #tc-check {
        right: 0;
        bottom: 98px;
        width: 88px;
        height: 52px;
      }
      #touch-controls #tc-menu {
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        width: 58px;
        height: 30px;
        font-size: 11px;
      }
      /* Held upright there is room under the game: bigger blocks, set a little higher. */
      body.portrait #touch-controls .tc-left,
      body.portrait #touch-controls .tc-right {
        bottom: max(40px, env(safe-area-inset-bottom));
      }
      body.portrait #touch-controls #tc-menu {
        top: auto;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 50%;
        margin-left: -29px;
      }

      /* Developer tuning panel: a dev tool, styled to stay out of the way. */
      #tuning-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 290px;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 8px;
        background: #0b1030;
        border: 2px solid #bfd8ff;
        outline: 2px solid #05071a;
        color: #ffffff;
        font: 11px/1.3 'Courier New', Courier, monospace;
        letter-spacing: 0.5px;
        z-index: 10;
      }
      #tuning-panel[hidden] {
        display: none;
      }
      #tuning-panel .tp-title {
        color: #ffc83a;
        font-weight: bold;
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 2px solid #2b5fd9;
      }
      #tuning-panel .tp-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0 6px;
        margin-bottom: 5px;
      }
      #tuning-panel .tp-value {
        color: #ffc83a;
        font-weight: bold;
      }
      #tuning-panel input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        margin: 1px 0 0;
        accent-color: #ffc83a;
      }
      #tuning-panel .tp-buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #tuning-panel button {
        flex: 1;
        padding: 4px;
        background: #1c2a66;
        color: #ffffff;
        border: 2px solid #bfd8ff;
        border-radius: 0;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      #tuning-panel button:hover {
        background: #2b5fd9;
      }
      #tuning-panel .tp-hint {
        margin-top: 6px;
        color: #6f7fb5;
      }

      /* Arena Asset Lab panel: developer tool. */
      #arena-lab-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: 330px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 8px;
        background: #0b1030;
        border: 2px solid #bfd8ff;
        outline: 2px solid #05071a;
        color: #ffffff;
        font: 11px/1.35 'Courier New', Courier, monospace;
        z-index: 10;
      }
      #arena-lab-panel .lab-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #ffc83a;
        font-weight: bold;
        padding-bottom: 4px;
        border-bottom: 2px solid #2b5fd9;
      }
      #arena-lab-panel h3 {
        margin: 10px 0 4px;
        font-size: 11px;
        color: #bfd8ff;
        text-transform: uppercase;
        border-bottom: 1px solid #2b5fd9;
      }
      #arena-lab-panel select {
        width: 100%;
        background: #1c2a66;
        color: #fff;
        border: 2px solid #bfd8ff;
        border-radius: 0;
        font: inherit;
        padding: 2px;
      }
      #arena-lab-panel button {
        padding: 3px 6px;
        background: #1c2a66;
        color: #fff;
        border: 2px solid #bfd8ff;
        border-radius: 0;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      #arena-lab-panel button:hover {
        background: #2b5fd9;
      }
      #arena-lab-panel .lab-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      #arena-lab-panel .lab-check {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin: 1px 0;
      }
      #arena-lab-panel .lab-check em,
      #arena-lab-panel .lab-slots em {
        color: #ffb08a;
        font-style: normal;
      }
      #arena-lab-panel .lab-note {
        margin: 4px 0;
        color: #9fb0e6;
      }
      #arena-lab-panel .lab-slider {
        display: grid;
        grid-template-columns: 1fr auto;
        margin-top: 4px;
      }
      #arena-lab-panel .lab-slider input {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #ffc83a;
      }
      #arena-lab-panel .lab-status,
      #arena-lab-panel .lab-readout {
        margin: 5px 0;
        padding: 3px 5px;
        white-space: pre-wrap;
        border: 1px solid currentColor;
      }
      #arena-lab-panel .good {
        color: #8af28a;
      }
      #arena-lab-panel .bad {
        color: #ff8a8a;
      }
      #arena-lab-panel ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #arena-lab-panel .slot-supplied b {
        color: #8af28a;
      }
      #arena-lab-panel .slot-provisional b {
        color: #ffc83a;
      }
      #arena-lab-panel .slot-unfit b,
      #arena-lab-panel .slot-missing b,
      #arena-lab-panel .issue-error {
        color: #ff8a8a;
      }
      #arena-lab-panel .issue-warn {
        color: #ffb08a;
      }
      #arena-lab-panel .lab-frames {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      #arena-lab-panel figure {
        margin: 0;
      }
      #arena-lab-panel figcaption {
        color: #9fb0e6;
      }
      /* A real checkerboard behind previews, so transparent pixels read as transparent. */
      #arena-lab-panel .lab-preview img,
      #arena-lab-panel .lab-preview canvas {
        display: block;
        image-rendering: pixelated;
        background: repeating-conic-gradient(#3a4680 0% 25%, #2a3566 0% 50%) 0 0 / 8px 8px;
        outline: 1px solid #bfd8ff;
      }
      #arena-lab-panel pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
        color: #dfe7ff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="title-art" src="./assets/title-locker-room.png" alt="" />
      <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
